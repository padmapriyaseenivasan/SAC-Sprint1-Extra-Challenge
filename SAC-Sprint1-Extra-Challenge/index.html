<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAC-3 Extra Challenge - Grid Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Sprint 1 Extra Challenge</h1>
  <p>Dynamic Multi-Column Grid Builder</p>
</header>

<section class="controls">
  <div class="control-group">
    <label for="columnCount">Number of columns</label>
    <input id="columnCount" type="number" min="1" max="12" value="4">
    <button id="minusBtn">−</button>
    <button id="plusBtn">+</button>
    <button id="applyColumns">Apply</button>
  </div>
  <div class="hint">
    Drag columns to reorder, or edit their order number. Use Edit to change title and colour.
  </div>
</section>

<main id="grid" class="grid"></main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button id="closeModal" class="close">×</button>
    <h2>Edit Column</h2>
    <label>Title</label>
    <input id="editTitle" type="text" maxlength="40">
    <label>Background colour</label>
    <div class="colour-row">
      <input id="editColor" type="text" placeholder="#4f46e5">
      <input id="colorPicker" type="color" value="#4f46e5">
    </div>
    <div class="preset-row">
      <button data-color="#4f46e5" class="preset purple"></button>
      <button data-color="#0ea5e9" class="preset blue"></button>
      <button data-color="#10b981" class="preset green"></button>
      <button data-color="#f59e0b" class="preset yellow"></button>
      <button data-color="#ef4444" class="preset red"></button>
      <button data-color="#8b5cf6" class="preset violet"></button>
    </div>
    <button id="saveEdit" class="save">Save Changes</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
